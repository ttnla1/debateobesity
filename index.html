<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Group 3 – Debate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-white shadow p-4 flex items-center gap-3">
  <button id="backBtn" onclick="goBack()" class="hidden text-xl">←</button>
  <h1 id="headerTitle" class="text-lg font-semibold">Group 3 – Debate</h1>
</header>

<main class="flex-1 p-4 max-w-lg mx-auto w-full">

  <!-- HOME PAGE (TESTYH UI) -->
  <div id="homePage" class="space-y-4">

    <div class="text-center mb-6">
      <p class="text-slate-600 font-medium text-lg">Group 3 – Debate</p>
      <p class="text-slate-400 text-sm">Project 6: Obesity – Environment</p>
    </div>

    <!-- BUTTON LIST -->
    <button onclick="showPage('introduction')" class="w-full bg-white rounded-2xl p-4 flex items-center gap-4 shadow">
      <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center">👥</div>
      <div class="flex-1 text-left">
        <p class="font-semibold">Introduction</p>
        <p class="text-sm text-slate-500">Team members overview</p>
      </div>
      <span class="text-slate-400 text-xl">›</span>
    </button>

    <button onclick="showPage('unhealthy')" class="w-full bg-white rounded-2xl p-4 flex items-center gap-4 shadow">
      <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center">🍔</div>
      <div class="flex-1 text-left">
        <p class="font-semibold">Unhealthy Food</p>
        <p class="text-sm text-slate-500">Processed and junk food</p>
      </div>
      <span class="text-slate-400 text-xl">›</span>
    </button>

    <button onclick="showPage('advertising')" class="w-full bg-white rounded-2xl p-4 flex items-center gap-4 shadow">
      <div class="w-12 h-12 bg-yellow-100 rounded-xl flex items-center justify-center">📺</div>
      <div class="flex-1 text-left">
        <p class="font-semibold">Food Advertising</p>
        <p class="text-sm text-slate-500">Marketing and media impact</p>
      </div>
      <span class="text-slate-400 text-xl">›</span>
    </button>

  </div>

  <!-- INTRODUCTION PAGE (TESTYH CONTENT) -->
  <div id="introductionPage" class="hidden space-y-4">

    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold">Introduction</h2>
      <p class="text-slate-500">Team members overview</p>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow flex items-center gap-4">
      <div class="w-12 h-12 bg-yellow-400 rounded-full flex items-center justify-center">👩‍🎓</div>
      <div>
        <p class="font-semibold">Trịnh Thị Ngọc Linh</p>
        <p class="text-sm text-slate-500">Team Leader</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow flex items-center gap-4">
      <div class="w-12 h-12 bg-pink-400 rounded-full flex items-center justify-center">👩‍🎓</div>
      <div>
        <p class="font-semibold">Lê Nguyễn Thảo My</p>
        <p class="text-sm text-slate-500">Team Member</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow flex items-center gap-4">
      <div class="w-12 h-12 bg-blue-400 rounded-full flex items-center justify-center">👨‍🎓</div>
      <div>
        <p class="font-semibold">Nguyễn Tiểu Long</p>
        <p class="text-sm text-slate-500">Team Member</p>
      </div>
    </div>

  </div>

  <!-- CONTENT PAGE (MIX LOGIC – IMAGE GRID) -->
  <div id="contentPage" class="hidden">

    <div class="text-center mb-6">
      <div id="contentIcon"
        class="w-20 h-20 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 border-2">
      </div>
      <h2 id="contentTitle" class="text-2xl font-bold"></h2>
      <p id="contentSubtitle" class="text-slate-500"></p>
    </div>

    <div id="contentImages" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

  </div>

</main>

<!-- SCRIPT (GIỮ NGUYÊN LOGIC MIX) -->
<script>
  const homePage = document.getElementById('homePage');
  const introductionPage = document.getElementById('introductionPage');
  const contentPage = document.getElementById('contentPage');
  const backBtn = document.getElementById('backBtn');
  const headerTitle = document.getElementById('headerTitle');

  const contentIcon = document.getElementById('contentIcon');
  const contentTitle = document.getElementById('contentTitle');
  const contentSubtitle = document.getElementById('contentSubtitle');
  const contentImages = document.getElementById('contentImages');

  const pageData = {
    unhealthy: {
      title: "Unhealthy Food",
      subtitle: "Processed and junk food",
      icon: "🍔",
      images: [
        "https://via.placeholder.com/300x200",
        "https://via.placeholder.com/300x200"
      ]
    },
    advertising: {
      title: "Food Advertising",
      subtitle: "Marketing and media impact",
      icon: "📺",
      images: [
        "https://via.placeholder.com/300x200",
        "https://via.placeholder.com/300x200"
      ]
    }
  };

  function showPage(page) {
    homePage.classList.add('hidden');
    introductionPage.classList.add('hidden');
    contentPage.classList.add('hidden');
    backBtn.classList.remove('hidden');

    if (page === 'introduction') {
      introductionPage.classList.remove('hidden');
      headerTitle.innerText = 'Introduction';
      return;
    }

    const data = pageData[page];
    if (!data) return;

    contentPage.classList.remove('hidden');
    headerTitle.innerText = data.title;

    contentIcon.innerText = data.icon;
    contentTitle.innerText = data.title;
    contentSubtitle.innerText = data.subtitle;

    contentImages.innerHTML = '';
    data.images.forEach(img => {
      contentImages.innerHTML += `
        <img src="${img}" class="rounded-xl shadow-md w-full object-cover">
      `;
    });
  }

  function goBack() {
    homePage.classList.remove('hidden');
    introductionPage.classList.add('hidden');
    contentPage.classList.add('hidden');
    backBtn.classList.add('hidden');
    headerTitle.innerText = 'Group 3 – Debate';
  }
</script>

</body>
</html>
