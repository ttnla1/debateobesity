<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Obesity – Environmental Causes</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800">

<div class="min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-white shadow px-6 py-4">
    <h1 class="text-2xl font-bold text-center">Obesity Caused by Environment</h1>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-5xl mx-auto w-full p-6">

    <!-- MENU -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
      <button onclick="showPage('unhealthy-food')" class="p-4 bg-red-100 rounded-xl hover:bg-red-200">Unhealthy Food</button>
      <button onclick="showPage('food-advertising')" class="p-4 bg-amber-100 rounded-xl hover:bg-amber-200">Food Advertising</button>
      <button onclick="showPage('mukbang')" class="p-4 bg-pink-100 rounded-xl hover:bg-pink-200">Mukbang</button>
      <button onclick="showPage('insulin')" class="p-4 bg-emerald-100 rounded-xl hover:bg-emerald-200">Insulin</button>
      <button onclick="showPage('stress')" class="p-4 bg-indigo-100 rounded-xl hover:bg-indigo-200">Stress</button>
      <button onclick="showPage('obesogens')" class="p-4 bg-cyan-100 rounded-xl hover:bg-cyan-200">Obesogens</button>
    </div>

    <!-- CONTENT PAGE -->
    <div id="contentPage" class="hidden">

      <div class="text-center mb-6">
        <div id="contentIcon"
             class="w-20 h-20 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 border-2">
        </div>
        <h2 id="contentTitle" class="text-2xl font-bold mb-2"></h2>
        <p id="contentSubtitle" class="text-slate-500"></p>
      </div>

      <!-- IMAGE CONTAINER -->
      <div id="contentBody"
           class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white/70 text-center py-3 text-sm text-slate-400 border-t">
    © 2026 Obesity Topic
  </footer>

</div>

<script>
/* ================= PAGE DATA ================= */
const pageData = {
  'unhealthy-food': {
    icon: '🍔',
    gradient: 'from-red-100 to-orange-100',
    borderColor: 'border-red-200',
    title: 'Unhealthy Food',
    subtitle: 'Processed and junk food',
    images: ['images/unhealthy.jpg']
  },

  'food-advertising': {
    icon: '📺',
    gradient: 'from-amber-100 to-yellow-100',
    borderColor: 'border-amber-200',
    title: 'Food Advertising',
    subtitle: 'Marketing and media impact',
    images: [
      'images/advertisement1.jpg',
      'images/advertisement2.jpg',
      'images/advertisement3.jpg'
    ]
  },

  'mukbang': {
    icon: '🎬',
    gradient: 'from-pink-100 to-rose-100',
    borderColor: 'border-pink-200',
    title: 'Mukbang Videos',
    subtitle: 'Eating broadcast content',
    images: [
      'images/mukbang1.jpg',
      'images/mukbang2.jpg'
    ]
  },

  'insulin': {
    icon: '💉',
    gradient: 'from-emerald-100 to-green-100',
    borderColor: 'border-emerald-200',
    title: 'Insulin',
    subtitle: 'Blood sugar regulation',
    images: ['images/insulin.jpg']
  },

  'stress': {
    icon: '😰',
    gradient: 'from-indigo-100 to-purple-100',
    borderColor: 'border-indigo-200',
    title: 'Stress',
    subtitle: 'Mental health and wellness',
    images: [
      'images/stress1.jpg',
      'images/stress2.jpg',
      'images/stress3.jpg'
    ]
  },

  'obesogens': {
    icon: '⚗️',
    gradient: 'from-cyan-100 to-blue-100',
    borderColor: 'border-cyan-200',
    title: 'Obesogens',
    subtitle: 'Chemical compounds effects',
    images: ['images/obesogen.jpg']
  }
};

/* ================= FUNCTIONS ================= */
function showPage(key) {
  const data = pageData[key];
  if (!data) return;

  document.getElementById('contentPage').classList.remove('hidden');

  const iconBox = document.getElementById('contentIcon');
  iconBox.textContent = data.icon;
  iconBox.className =
    `w-20 h-20 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 border-2
     ${data.borderColor} bg-gradient-to-br ${data.gradient}`;

  document.getElementById('contentTitle').textContent = data.title;
  document.getElementById('contentSubtitle').textContent = data.subtitle;

  renderImages(data.images);
}

function renderImages(images) {
  const body = document.getElementById('contentBody');
  body.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'flex flex-wrap justify-center gap-4';

  images.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    img.className = 'w-60 rounded-xl shadow-md';
    grid.appendChild(img);
  });

  body.appendChild(grid);
}
</script>

</body>
</html>
