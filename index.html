<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Obesity Caused by Environment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

<!-- HEADER -->
<header class="bg-white shadow-sm p-4 text-center">
  <h1 class="text-2xl font-bold">Obesity Topic.</h1>
  <p class="text-slate-500">Group 3 – Debate | Project 6: Obesity - Environment</p>
</header>

<!-- NAV -->
<nav class="flex justify-center gap-4 mt-4 flex-wrap">
  <button onclick="openPage('unhealthy-food')" class="navBtn">Unhealthy Food</button>
  <button onclick="openPage('food-advertising')" class="navBtn">Food Advertisement</button>
  <button onclick="openPage('mukbang')" class="navBtn">Mukbang</button>
  <button onclick="openPage('insulin')" class="navBtn">Insulin</button>
  <button onclick="openPage('stress')" class="navBtn">Stress</button>
  <button onclick="openPage('obesogens')" class="navBtn">Obesogen</button>
</nav>

<!-- CONTENT -->
<main class="max-w-5xl mx-auto p-6">

  <div id="contentPage" class="hidden">
    <div class="text-center mb-6">
      <div id="contentIcon" class="text-5xl mb-2"></div>
      <h2 id="contentTitle" class="text-2xl font-bold"></h2>
      <p id="contentSubtitle" class="text-slate-500"></p>
    </div>

    <!-- IMAGE GRID -->
    <div id="contentImages"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    </div>
  </div>

</main>

<!-- FOOTER -->
<footer class="text-center text-slate-400 text-sm py-4">
  © 2026 Obesity Topic
</footer>

<script>
const pageData = {
  'unhealthy-food': {
    icon: '🍔',
    title: 'Unhealthy Food',
    subtitle: 'Processed and junk food',
    images: ['unhealthy.jpg']
  },
  'food-advertising': {
    icon: '📺',
    title: 'Food Advertising',
    subtitle: 'Marketing and media impact',
    images: [
      'advertisement1.jpg',
      'advertisement2.jpg',
      'advertisement3.jpg'
    ]
  },
  'mukbang': {
    icon: '🎬',
    title: 'Mukbang Videos',
    subtitle: 'Eating broadcast content',
    images: ['mukbang1.jpg', 'mukbang2.jpg']
  },
  'insulin': {
    icon: '💉',
    title: 'Insulin',
    subtitle: 'Blood sugar regulation',
    images: ['insulin.jpg']
  },
  'stress': {
    icon: '😰',
    title: 'Stress',
    subtitle: 'Mental health and wellness',
    images: ['stress1.jpg', 'stress2.jpg', 'stress3.jpg']
  },
  'obesogens': {
    icon: '⚗️',
    title: 'Obesogens',
    subtitle: 'Chemical compounds effects',
    images: ['obesogen.jpg']
  }
};

function openPage(page) {
  const data = pageData[page];
  if (!data) return;

  document.getElementById('contentPage').classList.remove('hidden');
  document.getElementById('contentIcon').innerText = data.icon;
  document.getElementById('contentTitle').innerText = data.title;
  document.getElementById('contentSubtitle').innerText = data.subtitle;

  const imgBox = document.getElementById('contentImages');
  imgBox.innerHTML = '';

  data.images.forEach(img => {
    imgBox.innerHTML += `
      <img src="${img}"
           class="rounded-xl shadow-md w-full object-cover"
           alt="">
    `;
  });
}
</script>

<style>
.navBtn {
  background: white;
  border: 1px solid #e2e8f0;
  padding: 8px 14px;
  border-radius: 9999px;
  transition: 0.2s;
}
.navBtn:hover {
  background: #f1f5f9;
}
</style>

</body>
</html>
