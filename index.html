<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>Obesity Topic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-full bg-gradient-to-br from-slate-50 to-blue-50 text-slate-800">

<!-- HEADER -->
<header class="bg-white/80 backdrop-blur-md px-4 py-4 shadow-sm sticky top-0 z-50 border-b">
  <div class="flex items-center justify-between max-w-lg mx-auto">
    <button id="backBtn"
      class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center hidden">
      ←
    </button>
    <h1 id="headerTitle" class="text-xl font-bold flex-1 text-center">
      Obesity Topic
    </h1>
    <div class="w-10"></div>
  </div>
</header>

<!-- MAIN -->
<main class="flex-1 p-4 max-w-lg mx-auto w-full">

<!-- HOME -->
<div id="homePage">
  <div class="text-center mb-6">
    <p class="text-lg font-medium">Group 3 – Debate</p>
    <p class="text-slate-500 text-sm">Project 6: Obesity – Environment</p>
  </div>

  <nav class="space-y-3">
    <button class="nav-item" data-page="unhealthy-food">🍔 Unhealthy Food</button>
    <button class="nav-item" data-page="food-advertising">📺 Food Advertising</button>
    <button class="nav-item" data-page="mukbang">🎬 Mukbang</button>
    <button class="nav-item" data-page="stress">😰 Stress</button>
    <button class="nav-item" data-page="insulin">💉 Insulin</button>
    <button class="nav-item" data-page="obesogens">⚗️ Obesogens</button>
  </nav>
</div>

<!-- CONTENT PAGE -->
<div id="contentPage" class="hidden">
  <div class="text-center mb-6">
    <div id="contentIcon" class="text-5xl mb-2"></div>
    <h2 id="contentTitle" class="text-2xl font-bold"></h2>
    <p id="contentSubtitle" class="text-slate-500"></p>
  </div>

  <!-- IMAGE GRID (TỪ MIX) -->
  <div id="contentImages"
       class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  </div>
</div>

</main>

<!-- FOOTER -->
<footer class="text-center text-slate-400 text-sm py-4">
  © 2026 Obesity Topic
</footer>

<script>
const pageData = {
  'unhealthy-food': {
    icon: '🍔',
    title: 'Unhealthy Food',
    subtitle: 'Processed and junk food',
    images: ['images/unhealthy.jpg']
  },
  'food-advertising': {
    icon: '📺',
    title: 'Food Advertising',
    subtitle: 'Marketing and media impact',
    images: [
      'images/advertisement1.jpg',
      'images/advertisement2.jpg',
      'images/advertisement3.jpg'
    ]
  },
  'mukbang': {
    icon: '🎬',
    title: 'Mukbang',
    subtitle: 'Eating broadcast content',
    images: [
      'images/mukbang1.jpg',
      'images/mukbang2.jpg'
    ]
  },
  'stress': {
    icon: '😰',
    title: 'Stress',
    subtitle: 'Mental health and wellness',
    images: [
      'images/stress1.jpg',
      'images/stress2.jpg',
      'images/stress3.jpg'
    ]
  },
  'insulin': {
    icon: '💉',
    title: 'Insulin',
    subtitle: 'Blood sugar regulation',
    images: ['images/insulin.jpg']
  },
  'obesogens': {
    icon: '⚗️',
    title: 'Obesogens',
    subtitle: 'Chemical compounds effects',
    images: ['images/obesogen.jpg']
  }
};

function showPage(page) {
  const data = pageData[page];
  if (!data) return;

  homePage.classList.add('hidden');
  contentPage.classList.remove('hidden');
  backBtn.classList.remove('hidden');

  headerTitle.innerText = data.title;
  contentIcon.innerText = data.icon;
  contentTitle.innerText = data.title;
  contentSubtitle.innerText = data.subtitle;

  contentImages.innerHTML = '';
  data.images.forEach(img => {
    contentImages.innerHTML += `
      <img src="${img}"
           class="rounded-xl shadow-md w-full object-cover">
    `;
  });
}

const homePage = document.getElementById('homePage');
const contentPage = document.getElementById('contentPage');
const backBtn = document.getElementById('backBtn');
const headerTitle = document.getElementById('headerTitle');
const contentIcon = document.getElementById('contentIcon');
const contentTitle = document.getElementById('contentTitle');
const contentSubtitle = document.getElementById('contentSubtitle');
const contentImages = document.getElementById('contentImages');

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.onclick = () => showPage(btn.dataset.page);
});

backBtn.onclick = () => {
  contentPage.classList.add('hidden');
  homePage.classList.remove('hidden');
  backBtn.classList.add('hidden');
  headerTitle.innerText = 'Obesity Topic';
};
</script>

<style>
.nav-item {
  width: 100%;
  background: white;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid #e2e8f0;
  font-weight: 500;
}
.nav-item:hover {
  background: #f1f5f9;
}
</style>

</body>
</html>
